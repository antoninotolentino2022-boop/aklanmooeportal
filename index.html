 const back=`<button class="btn link" id="pgBack">← ${B?'Back to the portal':'Back to sign in'}</button>`;let h='';
 if(pg==='credits')h=`<div class="doc">${back}<h1>Credits</h1><p class="sub">The Division of Aklan MOOE Liquidation Portal was designed and developed by <b>Antoniño F. Tolentino</b>, Head Teacher I, Camanci Sur Elementary School.</p><h2>With thanks to</h2><ul class="credits">${CREDITS.map(c=>`<li><b>${esc(c[0])}</b><span>${esc(c[1])}</span></li>`).join('')}</ul></div>`;

  <h2>Before you ask for help</h2><ul><li>If the portal shows “Sorry, the file could not be opened”, open <b>${SITE}</b> instead.</li><li>Write down what you were doing and the exact message on the screen.</li><li>A screenshot helps a lot.</li><li>Never send your password to anyone. If you forget it, your district can give you a new sign-in code.</li></ul></div>`;
 if(pg==='help')h=`<div class="doc">${back}<h1>Help</h1><p class="sub">How a quarter’s liquidation moves through the portal: the school submits, the district checks, the division verifies.</p>
  <h2>Opening the portal</h2><ul><li>Open <b>${SITE}</b> on a phone or computer. It works in any browser, even one signed in to several Google accounts.</li><li>The older address, tinyurl.com/aklanmooeportal, still works, but it can show “Sorry, the file could not be opened” when the browser is signed in to more than one Google account. If that happens, use ${SITE}.</li></ul>
  <h2>Your username</h2><ul><li>Your username is your <b>School ID</b> plus your post: <b>-SH</b> for the School Head and <b>-AO</b> for the AO or bookkeeper. Example: <b>114245-SH</b>.</li><li>Districts: <b>NUMANCIA-PSDS</b> (District Supervisor) and <b>NUMANCIA-BK</b> (District Bookkeeper), with your district’s name. Division units: <b>U-</b> and the unit, for example <b>U-ICT</b>. Division Accounting: <b>DIV-ACCTG</b>.</li><li>The username belongs to the post, not the person. When you transfer or retire, the next holder uses the same username with their own password.</li></ul>
  <h2>First sign-in, or forgot your password</h2><ol><li>Ask your <b>District Supervisor or District Bookkeeper</b> for a sign-in code. District and Division staff ask the Division.</li><li>On the sign-in page, tap <b>First time or forgot password? Use a sign-in code</b>.</li><li>Type your username and the code (for example <b>K7QM-4TXP</b>).</li><li>If you are new in the post, choose <b>I am the new holder</b> and type your name and position. Then choose your own password.</li></ol><p>A code works once and lasts 7 days. Never share your password. Five wrong tries lock the account for 15 minutes.</p>
  <h2>For districts: giving sign-in codes</h2><ol><li>Open the <b>Accounts</b> tab. Every school of your district is listed with its -SH and -AO accounts.</li><li>Tap <b>Give sign-in code</b> (or <b>New sign-in code</b> for a forgotten password).</li><li>Tap <b>Copy message</b> and send it to the person by text or Messenger. The code is shown only once.</li><li>When someone leaves for good, tap <b>Mark as left</b>. They can no longer sign in, and open liquidations can be split at their last day.</li></ol>
  <h2>For schools</h2><ol><li>Choose the quarter at the top. A number on a quarter means something there needs you (for a school: it was returned for fixing). Older quarters are under <b>Earlier quarters</b>.</li><li>Enter the cash advance: ADA number, date and amount.</li><li>Add each check with its <b>OR / invoice number</b> and date, or bring them in from the offline MOOE Liquidation Desk with its “Download backup” file.</li><li>Look at the <b>Check numbers and receipts</b> box and fix what it lists.</li><li>Click <b>Photos</b> beside a check to upload pictures (before, during, after, items delivered). <b>Photo documentation (print)</b> makes the page for your liquidation folder. If you correct a check number later, the portal points out the photos left under the old number so you can move them.</li><li>When the balance is zero, click <b>Submit</b>. The quarter is locked unless the district or division returns it.</li><li>If it is returned, read the remarks in red, fix the problem, tick the box, and resubmit.</li><li><b>Trying the portal out?</b> Enter test checks freely. To remove them, open the quarter and use <b>Delete this quarter’s entries</b> (only before it is submitted). It also clears that quarter in the Liquidation Desk.</li></ol>
  <h2>For division units (Training and Development, ICT Unit and others)</h2><ol><li>Click <b>Record a new cash advance</b> for each activity: the purpose, the ADA or check number, the date received and the amount.</li><li>Open it and add each payment. Choose whether it was paid by check, in cash or by ADA.</li><li>Add photos, then click <b>Submit to Division Accounting</b>. Unit liquidations do not pass through a district.</li></ol>
  <h2>Your logo, heading and footer</h2><ul><li>Click <b>Our school</b> or <b>Our office</b> at the top of your page to upload your logo and set your address, contact numbers and footer.</li><li>The official heading lines (Republic of the Philippines, Department of Education, Region and Division) are set by the Division and are the same for everyone.</li></ul>
  <h2>Deadlines</h2><ul><li>Each quarter's liquidation is due to the Division Accounting Unit on the date set by the Division (for 2026: March 31, June 30, September 30 and December 15). Your district may set an earlier date. The school's page shows how many days are left; the district and Division lists mark late ones as <b>Overdue</b>.</li></ul>
  <h2>Monthly reports</h2><ul><li>By the 10th of each month, send the Division Accounting Unit the reports for the month before: the <b>Bank Reconciliation Statement</b> with its schedules, the <b>weAccess statement</b>, the <b>Check Disbursement Record</b>, the <b>Cash Disbursements Register</b> and the <b>RAAF</b>.</li><li>Open the <b>Liquidation Desk → Monthly reports</b>. Choose the month, type the weAccess ending balance, tick the checks that appear on the statement, and add the bank's own entries (interest, tax withheld, bank charges, interest returned to the Treasury). The reconciliation shows <b>Balanced</b> when the books and the bank agree. Print the forms, and type the date you sent them.</li><li>Generate the weAccess statement after the month ends, so the interest and tax at the end of a quarter are included.</li><li>The RAAF needs your checkbooks: register each one (first and last check number, date received) in the <b>Check numbers and receipts</b> box.</li><li>Your district and the Division see each month's status under <b>Monthly reports</b>; Division Accounting marks the month received.</li></ul>
  <h2>Check numbers and receipts</h2><ul><li><b>Register your checkbook</b> (first and last check number) in the <b>Check numbers and receipts</b> box. The portal then flags a check number outside the series.</li><li><b>A check number can be used only once.</b> The portal will not accept the same number twice, in any quarter.</li><li><b>Spoiled or cancelled check?</b> Add it with “Paid by: Cancelled / spoiled check”, so there is no gap in the numbers.</li><li><b>Every payment needs its OR or sales invoice.</b> One check paying several receipts: click <b>Receipts</b> beside the check and add each one.</li><li>The receipts should add up to the check amount <b>plus any tax withheld</b>.</li><li>The portal also warns about the same OR from the same supplier used twice, receipts dated far from the check, and checks dated outside the quarter or before the cash advance arrived.</li><li>Red items must be fixed before you can submit. For yellow items, look at each one, then tick the box to submit.</li></ul>
  <h2>Transfers, retirement and new designations</h2><ul><li>Open <b>Our school</b> or <b>Our office</b> and use <b>Leaving this post?</b> to record your last day.</li><li>For the School Head, a liquidation still open on that day is split (<b>turnover</b>): payments up to that day stay under your name, and the remaining cash moves to a new liquidation for the next holder.</li><li>Submitted liquidations stay under your name until they are verified. <b>Liquidations under your name</b> shows what is still open, for your clearance.</li><li>Your district then gives the next holder a sign-in code for the same username. At your new school, ask that district for the code of your new post.</li></ul>
  <h2>The Liquidation Desk (detailed entry and every form)</h2><ul><li>Open your quarter and tap <b>📒 Liquidation Desk</b>. It is the same MOOE Liquidation Desk as the offline tool, now inside the portal.</li><li><b>Bring in a Purchase Request from Excel</b> instead of typing items one by one: in the Desk, tap <b>Bring in a PR from Excel</b> and choose the file. The Desk reads every sheet that has the PR’s items table (Unit, Item Description, Quantity, Unit Cost), shows the items and total to check, then adds each PR as a purchase. <b>Blank PR form (Excel)</b> gives the official layout to fill in. You can also copy item rows in Excel and use <b>Paste rows from Excel</b> on a check.</li><li>A purchase without a check number is <b>not yet paid</b>: its PR, canvass, abstract and PO can be printed, but it is left out of the quarter and the portal until you type the check number and date.</li><li>Enter each check with its items, suppliers, OR / invoice numbers and canvass. The Desk makes every form: checklist, PR, canvass, abstract, PO, IAR, DV, payroll, and the quarterly register, Liquidation Report and Summary of Expenses. It also downloads Excel files.</li><li>Everything is <b>saved to the portal automatically</b>. Look for <b>All changes saved</b> under the <b>Back to the portal</b> button. Your district sees the same checks, and the check-number and receipt warnings and Monitoring use them.</li><li><b>Two people at once:</b> the School Head and the AO can both work in the Desk. The Desk shows who else is in it, and when you both save, the changes are combined check by check. If you both changed the same check, the last one saved is kept and the Desk tells you which check.</li><li><b>If the internet drops</b> while you work, the Desk says <b>Not saved yet</b> and keeps your work on this computer. It keeps trying, and the next time you open the Desk on this computer it sends what was missing. If your sign-in expires, the Desk asks you to sign in again and then saves.</li><li><b>On a phone</b>, each item of a check is shown as a small card, so every box fits on the screen.</li><li>Your school name, School Head, district bookkeeper and Division signatories come from the portal and cannot be changed in the Desk.</li><li>A quarter that is already submitted cannot be changed from the Desk unless it is returned.</li><li><b>No internet?</b> In the Desk, tap <b>Download backup</b>. Work in the offline MOOE Liquidation Desk file, then come back, open the Desk here and tap <b>Restore from backup</b>. It is sent to the portal.</li></ul>
  <h2>Printing the forms</h2><ul><li>Open the liquidation and find <b>Print forms</b> on the right. Tick the forms you need: Cover page, Cash Disbursements Register (Appendix 43), Check Disbursement Record, Liquidation Report (Appendix 44), Summary of Expenses, and the Certification read by teachers.</li><li>Choose the paper (long bond, A4 or short bond), click <b>Preview and print</b>, then <b>Print</b>. Use a computer with Chrome for printing.</li><li>The forms use your school’s logo, heading and footer, and the names set by the Division. Print 3 copies for signature: school, district or Division, and COA.</li><li>Photo documentation is printed per check from its <b>Photos</b> button. Purchase requests, canvass, POs, IAR, DV and other per-check forms are printed from the <b>Liquidation Desk</b>.</li></ul>
  <h2>Monitoring</h2><ul><li><b>Schools and offices:</b> tap <b>📊 Monitoring</b> at the top of your page. You see the cash advances of the year, how much is paid and liquidated, what the Division has verified, spending per month and per account code, and this quarter’s progress.</li><li><b>Districts:</b> the <b>Monitoring</b> tab shows every school of your district with a progress bar and its status. Sort by <b>Lowest % first</b> to see who needs help.</li><li><b>Division:</b> the <b>Monitoring</b> tab compares the districts and the division units. Click a district to see its schools.</li><li>On each progress bar, the dark line marks how much of the quarter has passed. A bar far behind the line means slow spending. Point at a bar to see the exact amounts.</li></ul>
  <h2>Looking back</h2><ul><li><b>Year summary</b> shows every liquidation of the year with the amounts and JEV numbers, and totals per account code.</li><li><b>Search all quarters</b> finds a payee, check or OR number, particulars, or an amount in any quarter.</li></ul>
  <h2>For districts</h2><ol><li>The portal opens on the quarter that has submissions waiting for you, and a number on each quarter shows how many. The tiles show how many are waiting. Click a school to open it.</li><li>Tick each hard copy once you have received it.</li><li><b>Checked – forward to Division</b> sends it on. <b>Return to school</b> needs a remark that says exactly what to fix.</li></ol>
  <h2>For the division</h2><ol><li>Open a school that is waiting for the division.</li><li>Enter the JEV number and click <b>Verify and record JEV</b>, or return it with a remark.</li><li><b>By district</b> shows each district’s progress. <b>Rules for all schools</b> changes the canvass threshold and caps for everyone.</li></ol>
  <h2>For the administrator</h2><ul><li>Accounts are made automatically for every school, district and unit when you import the school list in <b>Pilot setup</b>.</li><li>The <b>Accounts</b> tab gives sign-in codes to anyone, and <b>Mark as left</b> closes an account until the next holder signs in.</li><li><b>School list</b> imports the Division’s official list: <b>School ID | School name | District</b>.</li><li><b>Automatic cleanup</b> removes liquidations verified more than 3 years ago (the period can be changed), with 30 days’ notice and a folder to download first.</li><li>Test mode lets you view the portal as any account for demonstrations.</li><li><b>Test entries:</b> open any liquidation and use <b>Delete this liquidation (testing)</b>; it works at any stage, even after verification. <b>Sample data</b> in Pilot setup removes the fictional schools or puts them back.</li></ul></div>`;

  const report=(r,extra)=>{if(recovered){extra='Brought back your unsaved changes from '+recovered+'.'+(extra?' '+extra:'');recovered=''}const msg=[];if(r.locked&&r.locked.length)msg.push('Not sent to the portal: '+r.locked.map(qLabel).join(', ')+(r.locked.length>1?' are':' is')+' already submitted');if(r.errors&&r.errors.length)msg.push('Not sent: '+r.errors.join('; '));

   catch(e){failed=true;fail(e)}

function fromOffline(d,q){if(!d||!d.settings||!Array.isArray(d.checks))throw new Error('bad');
